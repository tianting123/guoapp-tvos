name: Sync upstream core

# 定期自动同步上游核心：把 submodule 指针（upstream/）更新到上游 main 最新。
#
# ⭐ 关键设计：先在 Ubuntu 上做「预检」，通过后才推 main。
# 预检包含两项：① fork 覆盖层在新版上游上能否合入（补丁打不上就别推）；
# ② Go 核心能否编译与测试通过（核心编不过也别推）。
# 旧版工作流是「先推 main、再触发构建」——一旦 fork 补丁打不上（上游改了同处代码），
# main 就已经被写坏，只能人工回退指针。2026-11-11 那次就是这样坏的
# （提交 14616c0「核心指针退回 fa7d948」是人工补救）。
# 现在预检不过就不推 main，main 保持原样，GitHub 发失败通知即可。
# tvOS 真机构建（需要 Xcode）放在 macos 上的 build.yml，由本工作流在推送后触发。
#
# 有更新时还会自动递增 VERSION 并在 CHANGELOG 补一节，确保每次同步都能发布新 Release。
# 若上游无更新，不做任何事。

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）检查一次上游。
    # 之前是 '*/2'（隔天），实际因「上游跨过站源私有化点」等问题被手动禁用过；
    # 现在改成每天跑，靠「预检通过才推」保证不会写坏 main。
    - cron: '17 3 * * *'
  workflow_dispatch:  # 手动触发，便于立即测试

permissions:
  contents: write  # 提交并推送 submodule 指针更新
  actions: write   # 触发 tvOS 构建工作流

concurrency:
  group: sync-upstream-core
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 更新 submodule 到上游最新 main
        id: update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git submodule update --remote -- upstream
          if git diff --quiet -- upstream; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游核心无更新，指针已是最新。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游核心有更新："
            git -C upstream log --oneline -5
          fi

      # ⭐ 预检 1：先确认 fork 补丁在新版上游上还能打上。
      # 补丁打不上说明上游改了同一处代码，需要人工把补丁重排到新版上；
      # 这时直接失败退出，不动 main。
      - name: 预检：fork 补丁能否在新版上游上合入
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/apply_fork_overlay.py
          echo "fork 覆盖层在新版上游上合入成功。"

      # ⭐ 预检 2：Go 核心能不能编过。核心编不过就别推 main。
      - name: 预检：Go 核心编译与测试
        if: steps.update.outputs.changed == 'true'
        working-directory: upstream/native
        run: |
          set -euo pipefail
          go version
          go build ./...
          go test ./core/...

      # ⭐ tvOS 真机构建无法在 Ubuntu 上跑（需要 Xcode / appletvos SDK），
      # 假设施加的纯上游核心同步只动 submodule 指针与版本号，不动 tvOS Swift 代码，
      # 因此把「Swift 能不能编过」交给下方触发后的 build.yml（在 macos-latest 上构建）。
      # 若后续同步开始改写 tvOS 源码，应改为在 macos  runner 上做预检后再推 main。

      - name: 自动提升版本号并补更新日志
        id: bump
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW_COMMIT="$(git -C upstream rev-parse --short HEAD)"
          NEW_SUBJECT="$(git -C upstream log -1 --format=%s)"
          export NEW_COMMIT NEW_SUBJECT
          python3 - <<'PYEOF'
          import os, re
          raw = open('VERSION').read()
          ver = raw.strip()
          head, dot, tail = ver.rpartition('.')
          assert dot and tail.isdigit(), f'VERSION 格式无法递增: {ver!r}'
          new_ver = f'{head}.{int(tail) + 1}'
          open('VERSION', 'w').write(new_ver + ('\n' if raw.endswith('\n') else ''))
          # 关于页版本与根 VERSION 统一：工程里的 MARKETING_VERSION 也同步，
          # 否则下次发版后 Xcode 直接构建又会显示旧版本。
          pbx = 'tvos/GuoAppTV/GuoAppTV.xcodeproj/project.pbxproj'
          text = open(pbx).read()
          text2, n = re.subn(r'MARKETING_VERSION = [^;]+;',
                             f'MARKETING_VERSION = {new_ver};', text)
          assert n > 0, 'pbxproj 里没有 MARKETING_VERSION'
          open(pbx, 'w').write(text2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={new_ver}\n')
          section = (f'## {new_ver}\n\n'
                     f'- 同步上游核心到 Xanerix/guoapp `{os.environ["NEW_COMMIT"]}`'
                     f'（{os.environ["NEW_SUBJECT"]}）。本次仅更新 Go 核心'
                     f'（submodule 指针），tvOS 应用代码无改动。\n\n')
          lines = open('CHANGELOG.md').read().splitlines(keepends=True)
          # 插到第一个比新版本号大的数字版本节之前（保持版本号倒序）。
          def version_key(title):
              parts = title.split('.')
              try:
                  return tuple(int(p) for p in parts)
              except ValueError:
                  return None
          new_key = version_key(new_ver)
          idx = len(lines)
          for i, ln in enumerate(lines):
              if not ln.startswith('## '):
                  continue
              title = ln[3:].strip()
              if '未发布' in title:
                  continue
              key = version_key(title)
              if key is not None and new_key is not None and key > new_key:
                  idx = i
                  break
          lines[idx:idx] = [section]
          open('CHANGELOG.md', 'w').write(''.join(lines))
          print(f'VERSION -> {new_ver}，CHANGELOG 已补一节，pbxproj MARKETING_VERSION 已同步')
          PYEOF

      - name: 提交并推送（指针 + 版本 + 更新日志）
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW_COMMIT="$(git -C upstream rev-parse HEAD)"
          NEW_SUBJECT="$(git -C upstream log -1 --format=%s)"
          git add upstream VERSION CHANGELOG.md tvos/GuoAppTV/GuoAppTV.xcodeproj/project.pbxproj
          git commit -m "同步上游核心到 ${NEW_COMMIT:0:7}（${NEW_SUBJECT}），版本升至 ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: 触发 tvOS 构建发布
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
